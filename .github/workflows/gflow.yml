name: gflow
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/gflow.py'
      - '.github/workflows/gflow.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: run
        run: python scripts/gflow.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gflow-out
          path: |
            shots/
            gflow.json
          if-no-files-found: warn
