name: proxyscan
on:
  workflow_dispatch:
    inputs:
      limit:
        description: max proxies
        default: '6000'
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: fetch lists
        run: |
          mkdir -p /tmp/p && cd /tmp/p
          for u in \
            "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt" \
            "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks5.txt" \
            "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt" \
            "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/socks5.txt" \
            "https://raw.githubusercontent.com/mmpx12/proxy-list/master/https.txt" \
            "https://raw.githubusercontent.com/mmpx12/proxy-list/master/http.txt" \
            "https://raw.githubusercontent.com/roosterkid/openproxylist/main/HTTPS_RAW.txt" \
            "https://raw.githubusercontent.com/roosterkid/openproxylist/main/SOCKS5_RAW.txt" \
            "https://raw.githubusercontent.com/zloi-user/hideip.me/main/http.txt" \
            "https://raw.githubusercontent.com/zloi-user/hideip.me/main/https.txt" \
            "https://raw.githubusercontent.com/vakhov/fresh-proxy-list/master/http.txt" \
            "https://raw.githubusercontent.com/clarketm/proxy-list/master/proxy-list-raw.txt" \
            "https://raw.githubusercontent.com/ShiftyTR/Proxy-List/master/https.txt" \
            "https://raw.githubusercontent.com/ShiftyTR/Proxy-List/master/http.txt" \
            ; do
            n=$(echo "$u" | md5sum | cut -c1-8)
            curl -sS -m 60 -o "$n.txt" "$u" || true
          done
          cat *.txt 2>/dev/null | grep -oE '^[0-9]{1,3}(\.[0-9]{1,3}){3}:[0-9]{2,5}$' | sort -u > /tmp/all.txt || true
          echo "COUNT=$(wc -l < /tmp/all.txt)"
          head -3 /tmp/all.txt
      - name: scan
        env:
          LIMIT: ${{ github.event.inputs.limit || '6000' }}
        run: |
          python3 -c "import ast;ast.parse(open('scripts/px_scan.py').read());print('SYNTAX OK')"
          python3 scripts/px_scan.py
