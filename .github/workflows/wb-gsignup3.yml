name: wb-gsignup3
on:
  workflow_dispatch:
jobs:
  g:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install playwright
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Google signup deep drive
        run: |
          python3 - <<'PY'
          import asyncio, json, random, string
          from playwright.async_api import async_playwright
          SIGNUP=("https://accounts.google.com/signup/v2/createaccount"
                  "?flowName=GlifWebSignIn&flowEntry=SignUp")
          def rnd(n=10):
              return "".join(random.choice(string.ascii_lowercase+string.digits) for _ in range(n))
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True,args=[
                      "--disable-blink-features=AutomationControlled","--no-sandbox"])
                  ctx=await b.new_context(locale="en-US",
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36")
                  pg=await ctx.new_page()
                  await pg.add_init_script("Object.defineProperty(navigator,'webdriver',{get:()=>undefined})")
                  await pg.goto(SIGNUP,wait_until="domcontentloaded",timeout=60000)
                  await pg.wait_for_timeout(3500)
                  await pg.fill("#firstName","Wei"); await pg.fill("#lastName","Chen")
                  await pg.click("#collectNameNext button",timeout=10000)
                  await pg.wait_for_timeout(5000)
                  # 1) 打印生日页可交互元素全貌
                  dom=await pg.evaluate("""() => {
                    const out=[];
                    document.querySelectorAll('input,select,[role=combobox],[role=option],[role=listbox],[jsname]').forEach(e=>{
                      if(out.length>=60) return;
                      const r=e.getBoundingClientRect();
                      if(r.width===0&&r.height===0) return;
                      out.push({tag:e.tagName,id:e.id||null,name:e.name||null,role:e.getAttribute('role'),
                                jsname:e.getAttribute('jsname'),type:e.type||null,
                                aria:e.getAttribute('aria-label'),txt:(e.innerText||'').slice(0,20)});
                    });
                    return out;
                  }""")
                  print("DOM_VISIBLE=",json.dumps(dom,ensure_ascii=False)[:3000],flush=True)
                  # 2) 键盘式填写：点标签文字再输入
                  async def fill_by_label(label, value, is_text=False):
                      try:
                          loc = pg.locator(f"text=/^{label}$/").first
                          await loc.click(timeout=8000)
                          await pg.wait_for_timeout(600)
                          if is_text:
                              await pg.keyboard.type(value, delay=60)
                          else:
                              await pg.keyboard.type(str(value), delay=80)
                          await pg.wait_for_timeout(500)
                          await pg.keyboard.press("Enter")
                          await pg.wait_for_timeout(600)
                          return True
                      except Exception as e:
                          print(f"  labelFail {label}: {type(e).__name__} {str(e)[:60]}",flush=True)
                          return False
                  for lab,val in (("Month","3"),("Day","14"),("Year","1992"),("Gender","Male")):
                      ok=await fill_by_label(lab,val)
                      print(f"  fill {lab}={val} -> {ok}",flush=True)
                  await pg.wait_for_timeout(1500)
                  txt=(await pg.inner_text("body"))[:400]
                  print("AFTER_FILL=",json.dumps({"url":pg.url[:120],"text":txt},ensure_ascii=False),flush=True)
                  # 3) 点 Next 看下一屏
                  try:
                      await pg.click("#birthdaygenderNext button",timeout=10000)
                  except Exception as e:
                      print("  nextFail",type(e).__name__,flush=True)
                  await pg.wait_for_timeout(6000)
                  txt2=(await pg.inner_text("body"))[:500]
                  hasU=bool(await pg.query_selector("input[name=Username]"))
                  print("AFTER_NEXT=",json.dumps({"url":pg.url[:140],"hasUsername":hasU,"text":txt2},ensure_ascii=False),flush=True)
                  await b.close()
          asyncio.run(main())
          PY
