name: wb-gsignup9
on:
  workflow_dispatch:
jobs:
  g:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install playwright
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Google signup complete
        run: |
          python3 - <<'PY'
          import asyncio, json, random, string
          from playwright.async_api import async_playwright
          SIGNUP=("https://accounts.google.com/signup/v2/createaccount"
                  "?flowName=GlifWebSignIn&flowEntry=SignUp")
          def rnd(n=8): return "".join(random.choice(string.ascii_lowercase+string.digits) for _ in range(n))
          LOCAL="wbauto"+rnd(7); PWD="Wb"+rnd(10)+"!7x"
          async def body(pg,n=700):
              try: return (await pg.inner_text("body"))[:n]
              except Exception: return ""
          async def visible_click(pg,el):
              await el.scroll_into_view_if_needed()
              b=await el.bounding_box()
              if not b: return False
              await pg.mouse.click(b["x"]+b["width"]/2,b["y"]+b["height"]/2); return True
          async def click_sel(pg,sel):
              el=await pg.query_selector(sel)
              return await visible_click(pg,el) if el else False
          async def opts(pg):
              return await pg.evaluate("""()=>{const o=[];document.querySelectorAll('[role=option]').forEach(e=>{
                const r=e.getBoundingClientRect(); if(r.width===0||r.height===0)return;
                o.push({t:(e.innerText||'').trim(),x:r.x+r.width/2,y:r.y+r.height/2});});return o;}""")
          async def pick(pg,trig,want):
              await click_sel(pg,trig); await pg.wait_for_timeout(900)
              for x in await opts(pg):
                  if x["t"].lower()==want.lower():
                      await pg.mouse.click(x["x"],x["y"]); await pg.wait_for_timeout(600); return True
              return False
          async def press_next(pg,tag=""):
              bs=await pg.evaluate("""()=>[...document.querySelectorAll('button')].map(b=>{
                const r=b.getBoundingClientRect();
                return {txt:(b.innerText||'').trim().slice(0,20),vis:r.width>0&&r.height>0,
                        x:r.x+r.width/2,y:r.y+r.height/2};}).filter(b=>b.vis)""")
              for b in bs:
                  if b["txt"].lower()=="next":
                      await pg.mouse.click(b["x"],b["y"]); await pg.wait_for_timeout(700)
                      print(f"  next@{tag}",flush=True); return
              print(f"  NO_NEXT@{tag} buttons={json.dumps(bs,ensure_ascii=False)[:300]}",flush=True)
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True,args=["--disable-blink-features=AutomationControlled","--no-sandbox"])
                  ctx=await b.new_context(locale="en-US",viewport={"width":1280,"height":900},
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36")
                  pg=await ctx.new_page()
                  await pg.add_init_script("Object.defineProperty(navigator,'webdriver',{get:()=>undefined})")
                  await pg.goto(SIGNUP,wait_until="domcontentloaded",timeout=60000)
                  await pg.wait_for_timeout(3500)
                  await pg.fill("#firstName","Wei"); await pg.fill("#lastName","Chen")
                  await press_next(pg,"name"); await pg.wait_for_timeout(5000)
                  await pick(pg,"#month","March")
                  await pg.fill("#day","14"); await pg.fill("#year","1992")
                  await pick(pg,"#gender","Male")
                  await press_next(pg,"bday"); await pg.wait_for_timeout(6000)
                  print("UNAME_PAGE=",json.dumps(await body(pg,350),ensure_ascii=False),flush=True)
                  # 关键：先点 "Create your own Gmail address" 单选项
                  rads=await pg.evaluate("""()=>[...document.querySelectorAll('input[type=radio],[role=radio],div[jsname]')]
                    .map(e=>{const r=e.getBoundingClientRect();
                      return {tag:e.tagName,jsname:e.getAttribute('jsname'),role:e.getAttribute('role'),
                              aria:e.getAttribute('aria-label'),txt:(e.innerText||'').trim().slice(0,40),
                              vis:r.width>0&&r.height>0,x:r.x+r.width/2,y:r.y+r.height/2};})
                    .filter(e=>e.vis && (e.role==='radio'||e.jsname==='V67aGc'||(e.txt||'').length>0)).slice(0,20)""")
                  print("RADIOS=",json.dumps(rads,ensure_ascii=False)[:1200],flush=True)
                  clicked=False
                  for r in rads:
                      if "create your own" in (r["txt"] or "").lower():
                          await pg.mouse.click(r["x"],r["y"]); await pg.wait_for_timeout(1200)
                          print("  clicked_create_own",flush=True); clicked=True; break
                  if not clicked:
                      try:
                          await pg.click("text=/Create your own Gmail address/i",timeout=6000)
                          await pg.wait_for_timeout(1200); print("  clicked_by_text",flush=True); clicked=True
                      except Exception as e:
                          print("  create_own_fail",type(e).__name__,flush=True)
                  if await pg.query_selector("input[name=Username]"):
                      vis=await pg.evaluate("""()=>{const e=document.querySelector('input[name=Username]');
                        const r=e.getBoundingClientRect(); return {w:r.width,h:r.height};}""")
                      print("  uname_input=",json.dumps(vis),flush=True)
                      await pg.fill("input[name=Username]",LOCAL)
                      print("  uname=",LOCAL,flush=True)
                      await press_next(pg,"uname"); await pg.wait_for_timeout(7000)
                      print("AFTER_UNAME=",json.dumps({"url":pg.url[:110],"body":await body(pg,500)},ensure_ascii=False),flush=True)
                  pw=None
                  for s in ("input[name=Passwd]","input[type=password]"):
                      if await pg.query_selector(s): pw=s; break
                  if pw:
                      await pg.fill(pw,PWD)
                      if await pg.query_selector("input[name=PasswdConfirmation]"):
                          await pg.fill("input[name=PasswdConfirmation]",PWD)
                      print("  PWD=",PWD,flush=True)
                      await press_next(pg,"pwd"); await pg.wait_for_timeout(14000)
                      print("AFTER_PWD=",json.dumps({"url":pg.url[:140],"body":await body(pg,800)},ensure_ascii=False),flush=True)
                  print("CREDS=",json.dumps({"email":LOCAL+"@gmail.com","pwd":PWD}),flush=True)
                  print("FINAL_URL=",pg.url[:220],flush=True)
                  print("FINAL_BODY=",json.dumps(await body(pg,900),ensure_ascii=False),flush=True)
                  await b.close()
          asyncio.run(main())
          PY
