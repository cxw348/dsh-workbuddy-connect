name: wb-gsignup2
on:
  workflow_dispatch:
jobs:
  g:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install playwright
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Google signup with robust widgets
        run: |
          python3 - <<'PY'
          import asyncio, json, random, string
          from playwright.async_api import async_playwright
          SIGNUP=("https://accounts.google.com/signup/v2/createaccount"
                  "?flowName=GlifWebSignIn&flowEntry=SignUp")
          def rnd(n=8):
              return "".join(random.choice(string.ascii_lowercase+string.digits) for _ in range(n))
          async def dump(pg,tag):
              try: txt=(await pg.inner_text("body"))[:400]
              except Exception: txt=""
              print(json.dumps({"tag":tag,"url":pg.url[:150],"title":await pg.title(),
                                "text":txt},ensure_ascii=False), flush=True)
          async def pick_option(pg, trigger_sel, choice_text):
              """Google 的自定义下拉：先点触发器，再在列表里点文本项"""
              try:
                  await pg.click(trigger_sel, timeout=8000)
                  await pg.wait_for_timeout(800)
                  # 列表项通常是 role=option 或 li
                  for sel in ("div[role=listbox] div[role=option]", "li[role=option]", "div[role=option]"):
                      els = await pg.query_selector_all(sel)
                      if els:
                          for e in els:
                              t = (await e.inner_text() or "").strip()
                              if choice_text in t or (choice_text.isdigit() and t.startswith(choice_text)):
                                  await e.click()
                                  return True
                  return False
              except Exception as e:
                  print("   pick fail",trigger_sel,type(e).__name__,str(e)[:80],flush=True)
                  return False
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True,args=[
                      "--disable-blink-features=AutomationControlled","--no-sandbox"])
                  ctx=await b.new_context(locale="en-US",
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36")
                  pg=await ctx.new_page()
                  await pg.add_init_script("Object.defineProperty(navigator,'webdriver',{get:()=>undefined})")
                  r=await pg.goto(SIGNUP,wait_until="domcontentloaded",timeout=60000)
                  await pg.wait_for_timeout(3500)
                  print("start status=",r.status if r else None,flush=True)
                  await pg.fill("#firstName","Wei"); await pg.fill("#lastName","Chen")
                  await pg.click("#collectNameNext button",timeout=10000)
                  await pg.wait_for_timeout(4500)
                  await dump(pg,"birthdaygender")
                  # 探出真实控件结构
                  struct=await pg.evaluate("""() => {
                    const sel=[...document.querySelectorAll('select')].map(s=>({id:s.id,name:s.name,opts:[...s.options].slice(0,4).map(o=>o.value)}));
                    const trig=[...document.querySelectorAll('[role=combobox],[jsname],input[type=text]')].slice(0,25).map(e=>({tag:e.tagName,id:e.id,name:e.name,role:e.getAttribute('role'),jsname:e.getAttribute('jsname'),aria:e.getAttribute('aria-label')}));
                    return {selects:sel, triggers:trig};
                  }""")
                  print(json.dumps(struct,ensure_ascii=False)[:1500],flush=True)
                  await b.close()
          asyncio.run(main())
          PY
