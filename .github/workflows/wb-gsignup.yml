name: wb-gsignup
on:
  workflow_dispatch:
jobs:
  g:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install playwright
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Playwright google signup walk
        run: |
          python3 - <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright
          SIGNUP=("https://accounts.google.com/signup/v2/createaccount"
                  "?flowName=GlifWebSignIn&flowEntry=SignUp")
          AUTH=("https://accounts.google.com/o/oauth2/v2/auth?access_type=offline"
                "&client_id=609538363374-9fhfgf4hn82ebacp1pjs793v28nem4hl.apps.googleusercontent.com"
                "&include_granted_scopes=true&prompt=select_account"
                "&redirect_uri=https%3A%2F%2Faccount.tencentid.com%2Fpublic%2Ftransfer%2F%3Fconnector%3Dgoogle"
                "&response_type=code&scope=openid+email+profile&state=gyAQy2LsXSuFJXe4mpSW8w82BPY6oAzAFgzCP0k-Nlw")
          async def snap(pg,tag):
              try: txt=(await pg.inner_text("body"))[:500]
              except Exception: txt=""
              print(json.dumps({"tag":tag,"url":pg.url[:170],"title":await pg.title(),
                                "hasFirst":bool(await pg.query_selector("#firstName")),
                                "hasPwd":bool(await pg.query_selector("input[type=password]")),
                                "hasPhone":bool(await pg.query_selector("#phoneNumber, input[name=phoneNumber]")),
                                "text":txt},ensure_ascii=False,indent=2))
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True,args=[
                      "--disable-blink-features=AutomationControlled","--no-sandbox"])
                  ctx=await b.new_context(locale="en-US",
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36")
                  pg=await ctx.new_page()
                  await pg.add_init_script("Object.defineProperty(navigator,'webdriver',{get:()=>undefined})")
                  # 1) 腾讯 Google OAuth 授权页（看能否到账号选择）
                  r=await pg.goto(AUTH,wait_until="domcontentloaded",timeout=60000)
                  await pg.wait_for_timeout(4000)
                  print("AUTH status=",r.status if r else None)
                  await snap(pg,"oauth-authorize")
                  # 2) Google 建号
                  r=await pg.goto(SIGNUP,wait_until="domcontentloaded",timeout=60000)
                  await pg.wait_for_timeout(4000)
                  print("SIGNUP status=",r.status if r else None)
                  await snap(pg,"signup-start")
                  try:
                      await pg.fill("#firstName","Wei",timeout=15000)
                      await pg.fill("#lastName","Chen",timeout=5000)
                      await pg.click("#collectNameNext button",timeout=8000)
                      await pg.wait_for_timeout(5000)
                      await snap(pg,"after-name")
                      # 生日性别
                      for sel,val in (("#month","3"),("#day","14"),("#year","1992")):
                          try:
                              await pg.select_option(sel,val,timeout=6000)
                          except Exception as e:
                              print("  select fail",sel,type(e).__name__)
                      try:
                          await pg.select_option("#gender","1",timeout=6000)
                      except Exception as e:
                          print("  gender fail",type(e).__name__)
                      try:
                          await pg.click("#birthdaygenderNext button",timeout=8000)
                      except Exception as e:
                          print("  bdnext fail",type(e).__name__)
                      await pg.wait_for_timeout(6000)
                      await snap(pg,"after-birthday")
                      # 用户名/密码步
                      try:
                          await pg.fill("input[name=Username]",f"wbtest{__import__('random').randint(10000,99999)}",timeout=12000)
                          await pg.click("#next button",timeout=8000)
                          await pg.wait_for_timeout(5000)
                          await snap(pg,"after-username")
                      except Exception as e:
                          print("  uname fail",type(e).__name__,str(e)[:120])
                  except Exception as e:
                      print("FLOW_ERR",type(e).__name__,str(e)[:200])
                      await snap(pg,"flow-error")
                  await b.close()
          asyncio.run(main())
          PY
