name: otp2
on:
  workflow_dispatch:
    inputs:
      n: {description: 'probe count', required: false, default: '2'}
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright invisible_playwright requests
      - run: playwright install --with-deps firefox
      - run: curl -s https://api.ip.sb/geoip || true
      - run: python scripts/otp2_probe.py "${{ inputs.n }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otp2-out
          path: |
            scripts/otp2_probe.json
            scripts/otp2/*.png
