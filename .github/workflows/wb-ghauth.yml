name: wb-ghauth
on:
  workflow_dispatch:
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install playwright
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Probe GitHub OAuth pages
        env:
          AUTH_URL: ${{ inputs.authurl }}
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          UA={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36",
              "Accept":"text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language":"en-US,en;q=0.9"}
          def get(u):
              try:
                  req=urllib.request.Request(u,headers=UA)
                  with urllib.request.urlopen(req,timeout=30) as r:
                      b=r.read()
                      return r.status,len(b),b
              except urllib.error.HTTPError as e:
                  return e.code,len(e.read() or b''),b''
              except Exception as e:
                  return -1,0,str(e).encode()
          for u in ["https://github.com/login",
                    "https://github.com/login/oauth/authorize?allow_signup=true&client_id=Iv23liqNab23Foc1AG5e&prompt=select_account&redirect_uri=https%3A%2F%2Faccount.tencentid.com%2Fpublic%2Ftransfer%2F%3Fconnector%3Dgithub&scope=read%3Auser+user%3Aemail&state=1p2Uhmv-vvYgdc9ixtgkjFqsqYoAWxpgjnhPJPhA0Wc",
                    "https://github.com/signup"]:
              st,n,b=get(u)
              txt=b.decode("utf8","replace") if b else ""
              marks=[m for m in ("captcha-delivery","datadome","Please enable JS","unusual activity","login_field","authorize") if m.lower() in txt.lower()]
              print(f"{st}  {n:8d}  {u[:80]}")
              print(f"    marks={marks}")
          PY
      - name: Playwright real browser on GitHub OAuth
        run: |
          python3 - <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright
          URL=("https://github.com/login/oauth/authorize?allow_signup=true"
               "&client_id=Iv23liqNab23Foc1AG5e&prompt=select_account"
               "&redirect_uri=https%3A%2F%2Faccount.tencentid.com%2Fpublic%2Ftransfer%2F%3Fconnector%3Dgithub"
               "&scope=read%3Auser+user%3Aemail&state=1p2Uhmv-vvYgdc9ixtgkjFqsqYoAWxpgjnhPJPhA0Wc")
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True,args=[
                      "--disable-blink-features=AutomationControlled","--no-sandbox"])
                  ctx=await b.new_context(locale="en-US",
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36")
                  pg=await ctx.new_page()
                  await pg.add_init_script("Object.defineProperty(navigator,'webdriver',{get:()=>undefined})")
                  r=await pg.goto(URL, wait_until="domcontentloaded", timeout=60000)
                  await pg.wait_for_timeout(4000)
                  html=await pg.content()
                  info={"status": r.status if r else None,
                        "url": pg.url[:160],
                        "title": await pg.title(),
                        "len": len(html),
                        "hasLoginField": bool(await pg.query_selector("#login_field")),
                        "hasSignup": bool(await pg.query_selector("#email")),
                        "hasIframe": len(await pg.query_selector_all("iframe")),
                        "bodyCls": await pg.evaluate("document.body ? document.body.className : ''"),
                        "text": (await pg.inner_text("body"))[:300] if await pg.query_selector("body") else ""}
                  print(json.dumps(info, ensure_ascii=False, indent=2))
                  await b.close()
          asyncio.run(main())
          PY
