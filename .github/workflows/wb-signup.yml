name: wb-signup
on:
  workflow_dispatch:
jobs:
  signup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install playwright
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Playwright github signup
        run: |
          python3 - <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright
          async def probe(pg, url, tag):
              r=await pg.goto(url, wait_until="domcontentloaded", timeout=60000)
              await pg.wait_for_timeout(5000)
              html=await pg.content()
              info={"tag":tag,"status": r.status if r else None,"url":pg.url[:170],
                    "title":await pg.title(),"len":len(html),
                    "hasEmail":bool(await pg.query_selector("#email, input[name='user[email]']")),
                    "iframe":len(await pg.query_selector_all("iframe")),
                    "bodyCls":await pg.evaluate("document.body?document.body.className:''"),
                    "ddCookie": None,
                    "text":((await pg.inner_text("body"))[:400] if await pg.query_selector("body") else "")}
              cks=await pg.context.cookies()
              info["ddCookie"]=[c["name"] for c in cks if "datadome" in c["name"].lower()]
              print(json.dumps(info,ensure_ascii=False,indent=2))
              return info
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True,args=[
                      "--disable-blink-features=AutomationControlled","--no-sandbox"])
                  ctx=await b.new_context(locale="en-US",
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36")
                  pg=await ctx.new_page()
                  await pg.add_init_script("Object.defineProperty(navigator,'webdriver',{get:()=>undefined})")
                  await probe(pg,"https://github.com/","home")
                  await probe(pg,"https://github.com/signup","signup")
                  await pg.wait_for_timeout(3000)
                  await probe(pg,"https://github.com/signup","signup-retry")
                  await b.close()
          asyncio.run(main())
          PY
