name: wb-gsignup11
on:
  workflow_dispatch:
jobs:
  g:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install playwright
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Google signup via JS setter, chase to the end
        run: |
          python3 - <<'PY'
          import asyncio, json, random, string
          from playwright.async_api import async_playwright
          SIGNUP=("https://accounts.google.com/signup/v2/createaccount"
                  "?flowName=GlifWebSignIn&flowEntry=SignUp")
          def rnd(n=8): return "".join(random.choice(string.ascii_lowercase+string.digits) for _ in range(n))
          LOCAL="wbauto"+rnd(7); PWD="Wb"+rnd(8)+"!7xQ"
          JS_SET="""(a)=>{const [sel,v]=a;const e=document.querySelector(sel);
            if(!e)return null;
            const d=Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set;
            d.call(e,v); e.dispatchEvent(new Event('input',{bubbles:true}));
            e.dispatchEvent(new Event('change',{bubbles:true})); return e.value;}"""
          async def body(pg,n=900):
              try: return (await pg.inner_text("body"))[:n]
              except Exception: return ""
          async def js_set(pg,sel,v):
              return await pg.evaluate(JS_SET,[sel,v])
          async def click_sel(pg,sel):
              el=await pg.query_selector(sel)
              if not el: return False
              await el.scroll_into_view_if_needed(); b=await el.bounding_box()
              if not b: return False
              await pg.mouse.click(b["x"]+b["width"]/2,b["y"]+b["height"]/2); return True
          async def opts(pg):
              return await pg.evaluate("""()=>{const o=[];document.querySelectorAll('[role=option]').forEach(e=>{
                const r=e.getBoundingClientRect(); if(r.width===0||r.height===0)return;
                o.push({t:(e.innerText||'').trim(),x:r.x+r.width/2,y:r.y+r.height/2});});return o;}""")
          async def pick(pg,trig,want):
              await click_sel(pg,trig); await pg.wait_for_timeout(900)
              for x in await opts(pg):
                  if x["t"].lower()==want.lower():
                      await pg.mouse.click(x["x"],x["y"]); await pg.wait_for_timeout(600); return True
              return False
          async def next_btn(pg,tag=""):
              r=await pg.evaluate("""()=>{for(const b of document.querySelectorAll('button')){
                const t=(b.innerText||'').trim().toLowerCase(); const r=b.getBoundingClientRect();
                if(t==='next'&&r.width>0){b.click(); return {ok:true,x:r.x,y:r.y};}} return {ok:false};}""")
              await pg.wait_for_timeout(900)
              print(f"  next@{tag}={json.dumps(r)}",flush=True); return r.get("ok",False)
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True,args=["--disable-blink-features=AutomationControlled","--no-sandbox"])
                  ctx=await b.new_context(locale="en-US",viewport={"width":1280,"height":900},
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36")
                  pg=await ctx.new_page()
                  await pg.add_init_script("Object.defineProperty(navigator,'webdriver',{get:()=>undefined})")
                  await pg.goto(SIGNUP,wait_until="domcontentloaded",timeout=60000)
                  await pg.wait_for_timeout(3500)
                  await pg.fill("#firstName","Wei"); await pg.fill("#lastName","Chen")
                  await next_btn(pg,"name"); await pg.wait_for_timeout(5000)
                  await pick(pg,"#month","March")
                  await pg.fill("#day","14"); await pg.fill("#year","1992")
                  await pick(pg,"#gender","Male")
                  await next_btn(pg,"bday"); await pg.wait_for_timeout(6500)
                  print("STEP=",json.dumps(await body(pg,320),ensure_ascii=False),flush=True)
                  # 若是推荐地址页，先点 Create your own
                  if "create your own" in (await body(pg,400)).lower():
                      try:
                          await pg.click("text=/Create your own Gmail address/i",timeout=5000)
                          await pg.wait_for_timeout(1200); print("  clicked_own",flush=True)
                      except Exception as e: print("  ownFail",type(e).__name__,flush=True)
                  v=await js_set(pg,"input[name=Username]",LOCAL)
                  print("  uname_set=",v,flush=True)
                  await next_btn(pg,"uname"); await pg.wait_for_timeout(7000)
                  print("STEP2=",json.dumps({"url":pg.url[:110],"body":await body(pg,400)},ensure_ascii=False),flush=True)
                  # 密码页
                  n=await pg.evaluate("""(v)=>{const d=Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set;
                    const es=[...document.querySelectorAll('input[type=password]')]; let c=0;
                    es.forEach(e=>{d.call(e,v);e.dispatchEvent(new Event('input',{bubbles:true}));
                      e.dispatchEvent(new Event('change',{bubbles:true}));c++;}); return {n:es.length,filled:c};}""",PWD)
                  print("  pwd=",json.dumps(n),flush=True)
                  await next_btn(pg,"pwd"); await pg.wait_for_timeout(16000)
                  print("AFTER_PWD=",json.dumps({"url":pg.url[:160],"body":await body(pg,900)},ensure_ascii=False),flush=True)
                  # 继续推进：不管出现什么页，报告并尝试继续
                  for k in range(3):
                      txt=await body(pg,900)
                      print(f"PAGE{k}=",json.dumps({"url":pg.url[:150],"body":txt[:500]},ensure_ascii=False),flush=True)
                      if not await next_btn(pg,f"auto{k}"): break
                      await pg.wait_for_timeout(12000)
                  print("CREDS=",json.dumps({"email":LOCAL+"@gmail.com","pwd":PWD}),flush=True)
                  print("FINAL_URL=",pg.url[:250],flush=True)
                  print("FINAL_BODY=",json.dumps(await body(pg,1500),ensure_ascii=False),flush=True)
                  await b.close()
          asyncio.run(main())
          PY
