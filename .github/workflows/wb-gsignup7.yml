name: wb-gsignup7
on:
  workflow_dispatch:
jobs:
  g:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install playwright
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Google signup direct fill
        run: |
          python3 - <<'PY'
          import asyncio, json, random, string
          from playwright.async_api import async_playwright
          SIGNUP=("https://accounts.google.com/signup/v2/createaccount"
                  "?flowName=GlifWebSignIn&flowEntry=SignUp")
          def rnd(n=6): return "".join(random.choice(string.ascii_lowercase+string.digits) for _ in range(n))
          LOCAL="wbauto"+rnd(8); PWD="Wb"+rnd(10)+"!7x"
          async def body(pg,n=600):
              try: return (await pg.inner_text("body"))[:n]
              except Exception: return ""
          async def click_sel(pg,sel):
              el=await pg.query_selector(sel)
              if not el: return False
              await el.scroll_into_view_if_needed(); b=await el.bounding_box()
              if not b: return False
              await pg.mouse.click(b["x"]+b["width"]/2,b["y"]+b["height"]/2); return True
          async def opts(pg):
              return await pg.evaluate("""()=>{const o=[];document.querySelectorAll('[role=option]').forEach(e=>{
                const r=e.getBoundingClientRect(); if(r.width===0||r.height===0)return;
                o.push({t:(e.innerText||'').trim(),x:r.x+r.width/2,y:r.y+r.height/2});});return o;}""")
          async def pick(pg,trig,want):
              await click_sel(pg,trig); await pg.wait_for_timeout(900)
              for x in await opts(pg):
                  if x["t"].lower()==want.lower():
                      await pg.mouse.click(x["x"],x["y"]); await pg.wait_for_timeout(600)
                      print(f"  pick {trig}={x['t']}",flush=True); return True
              print(f"  PICK_FAIL {trig}={want}",flush=True); return False
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True,args=["--disable-blink-features=AutomationControlled","--no-sandbox"])
                  ctx=await b.new_context(locale="en-US",viewport={"width":1280,"height":900},
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36")
                  pg=await ctx.new_page()
                  await pg.add_init_script("Object.defineProperty(navigator,'webdriver',{get:()=>undefined})")
                  await pg.goto(SIGNUP,wait_until="domcontentloaded",timeout=60000)
                  await pg.wait_for_timeout(3500)
                  await pg.fill("#firstName","Wei"); await pg.fill("#lastName","Chen")
                  await pg.click("#collectNameNext button",timeout=10000)
                  await pg.wait_for_timeout(5000)
                  await pick(pg,"#month","March")
                  await pg.fill("#day","14"); await pg.wait_for_timeout(300)
                  await pg.fill("#year","1992"); await pg.wait_for_timeout(300)
                  await pick(pg,"#gender","Male")
                  print("  values day=",await pg.input_value("#day"),"year=",await pg.input_value("#year"),flush=True)
                  await pg.click("#birthdaygenderNext button",timeout=8000)
                  await pg.wait_for_timeout(6000)
                  print("AFTER_BDAY=",json.dumps({"url":pg.url[:110],"body":await body(pg,500)},ensure_ascii=False),flush=True)
                  if await pg.query_selector("input[name=Username]"):
                      await pg.fill("input[name=Username]", LOCAL)
                      print("  uname=",LOCAL,flush=True)
                      for s in ("#usernameNext button","button[jsname=OCklVe]"):
                          try: await pg.click(s,timeout=6000); break
                          except Exception: pass
                      await pg.wait_for_timeout(6000)
                      print("AFTER_UNAME=",json.dumps({"url":pg.url[:110],"body":await body(pg,500)},ensure_ascii=False),flush=True)
                  pw=None
                  for s in ("input[name=Passwd]","input[type=password]"):
                      if await pg.query_selector(s): pw=s; break
                  if pw:
                      await pg.fill(pw,PWD); await pg.fill("input[name=PasswdConfirmation]",PWD) if await pg.query_selector("input[name=PasswdConfirmation]") else None
                      print("  PWD_SET=",PWD,flush=True)
                      for s in ("#passwdNext button","button[jsname=OCklVe]"):
                          try: await pg.click(s,timeout=6000); break
                          except Exception: pass
                      await pg.wait_for_timeout(9000)
                      print("AFTER_PWD=",json.dumps({"url":pg.url[:130],"body":await body(pg,700)},ensure_ascii=False),flush=True)
                  print("CREDS=",json.dumps({"local":LOCAL,"pwd":PWD}),flush=True)
                  print("FINAL_URL=",pg.url[:200],flush=True)
                  await b.close()
          asyncio.run(main())
          PY
