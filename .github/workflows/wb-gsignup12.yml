name: wb-gsignup12
on:
  workflow_dispatch:
jobs:
  g:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install playwright
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Google account via existing email (CF temp mail)
        env:
          MAILBASE: https://mail.tbrmail548.dpdns.org
        run: |
          python3 - <<'PY'
          import asyncio, json, os, random, string, urllib.request, time
          from playwright.async_api import async_playwright
          MB=os.environ["MAILBASE"].rstrip("/")
          SIGNUP=("https://accounts.google.com/signup/v2/createaccount"
                  "?flowName=GlifWebSignIn&flowEntry=SignUp")
          def rnd(n=8): return "".join(random.choice(string.ascii_lowercase+string.digits) for _ in range(n))
          def post(p,payload):
              rq=urllib.request.Request(p,data=json.dumps(payload).encode(),
                  headers={"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(rq,timeout=30) as r: return json.loads(r.read())
          def get(p,tok=None):
              h={"Authorization":"Bearer "+tok} if tok else {}
              rq=urllib.request.Request(p,headers=h)
              with urllib.request.urlopen(rq,timeout=30) as r: return json.loads(r.read())
          PWD="Wb"+rnd(8)+"!7xQ"
          async def body(pg,n=600):
              try: return (await pg.inner_text("body"))[:n]
              except Exception: return ""
          async def js_set(pg,sel,v):
              return await pg.evaluate("""(a)=>{const[sel,v]=a;const e=document.querySelector(sel);
                if(!e)return null;const d=Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set;
                d.call(e,v);e.dispatchEvent(new Event('input',{bubbles:true}));
                e.dispatchEvent(new Event('change',{bubbles:true}));return e.value;}""",[sel,v])
          async def click_sel(pg,sel):
              el=await pg.query_selector(sel)
              if not el: return False
              await el.scroll_into_view_if_needed(); b=await el.bounding_box()
              if not b: return False
              await pg.mouse.click(b["x"]+b["width"]/2,b["y"]+b["height"]/2); return True
          async def opts(pg):
              return await pg.evaluate("""()=>{const o=[];document.querySelectorAll('[role=option]').forEach(e=>{
                const r=e.getBoundingClientRect(); if(r.width===0||r.height===0)return;
                o.push({t:(e.innerText||'').trim(),x:r.x+r.width/2,y:r.y+r.height/2});});return o;}""")
          async def pick(pg,trig,want):
              await click_sel(pg,trig); await pg.wait_for_timeout(900)
              for x in await opts(pg):
                  if x["t"].lower()==want.lower():
                      await pg.mouse.click(x["x"],x["y"]); await pg.wait_for_timeout(600); return True
              return False
          async def next_btn(pg,tag=""):
              r=await pg.evaluate("""()=>{for(const b of document.querySelectorAll('button')){
                const t=(b.innerText||'').trim().toLowerCase();const r=b.getBoundingClientRect();
                if(t==='next'&&r.width>0){b.click();return true;}}return false;}""")
              await pg.wait_for_timeout(900); print(f"  next@{tag}={r}",flush=True); return r
          async def main():
              # 1) 先建一个 CF 邮箱
              mb=post(f"{MB}/api/new_address",{"enablePrefix":True,"name":"g"+rnd(10),
                                               "domain":"tbrmail548.dpdns.org"})
              email=mb["address"]; jwt=mb["jwt"]
              print("MAILBOX=",email,flush=True)
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True,args=["--disable-blink-features=AutomationControlled","--no-sandbox"])
                  ctx=await b.new_context(locale="en-US",viewport={"width":1280,"height":900},
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36")
                  pg=await ctx.new_page()
                  await pg.add_init_script("Object.defineProperty(navigator,'webdriver',{get:()=>undefined})")
                  await pg.goto(SIGNUP,wait_until="domcontentloaded",timeout=60000)
                  await pg.wait_for_timeout(3500)
                  await pg.fill("#firstName","Wei"); await pg.fill("#lastName","Chen")
                  await next_btn(pg,"name"); await pg.wait_for_timeout(5000)
                  await pick(pg,"#month","March")
                  await pg.fill("#day","14"); await pg.fill("#year","1992")
                  await pick(pg,"#gender","Male")
                  await next_btn(pg,"bday"); await pg.wait_for_timeout(6500)
                  print("STEP=",json.dumps(await body(pg,400),ensure_ascii=False),flush=True)
                  # 2) 点 Use your existing email
                  clicked=False
                  for sel in ("text=/Use your existing email/i",):
                      try:
                          await pg.click(sel,timeout=6000); await pg.wait_for_timeout(1600)
                          clicked=True; print("  clicked_existing_email",flush=True); break
                      except Exception as e: print("  existingFail",type(e).__name__,flush=True)
                  print("STEP2=",json.dumps({"url":pg.url[:110],"body":await body(pg,450)},ensure_ascii=False),flush=True)
                  if clicked:
                      # 3) 填外部邮箱
                      ins=await pg.evaluate("""()=>[...document.querySelectorAll('input')].map(e=>{const r=e.getBoundingClientRect();
                        return {name:e.name,type:e.type,aria:e.getAttribute('aria-label'),vis:r.width>0&&r.height>0};}).filter(x=>x.vis)""")
                      print("  INPUTS2=",json.dumps(ins),flush=True)
                      for sel in ("input[name=Email]","input[type=email]","input[name=username]"):
                          if await pg.query_selector(sel):
                              await pg.fill(sel,email); print("  filled_email via",sel,flush=True); break
                      await next_btn(pg,"email"); await pg.wait_for_timeout(6500)
                      print("STEP3=",json.dumps({"url":pg.url[:110],"body":await body(pg,450)},ensure_ascii=False),flush=True)
                  # 4) 密码页
                  if await pg.query_selector("input[type=password]"):
                      n=await pg.evaluate("""(v)=>{const d=Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set;
                        const es=[...document.querySelectorAll('input[type=password]')];
                        es.forEach(e=>{d.call(e,v);e.dispatchEvent(new Event('input',{bubbles:true}));
                          e.dispatchEvent(new Event('change',{bubbles:true}));});return es.length;}""",PWD)
                      print("  pwd_filled=",n,flush=True)
                      await next_btn(pg,"pwd"); await pg.wait_for_timeout(15000)
                      print("AFTER_PWD=",json.dumps({"url":pg.url[:160],"body":await body(pg,800)},ensure_ascii=False),flush=True)
                  # 5) 验证码页：等邮件
                  txt=await body(pg,800)
                  if "verify" in txt.lower() or "code" in txt.lower() or "confirm" in txt.lower():
                      code=None
                      for i in range(30):
                          try:
                              d=get(f"{MB}/api/mails?limit=20&offset=0",jwt)
                              for m in d.get("results",[]):
                                  blob=(m.get("preview") or "")+" "+str(m.get("subject") or "")
                                  import re
                                  mm=re.search(r"\b(\d{6})\b",blob)
                                  if mm: code=mm.group(1); break
                          except Exception as e: print(f"  poll{i}_err {type(e).__name__}",flush=True)
                          if code: break
                          time.sleep(4)
                      print("  CODE=",code,flush=True)
                      if code:
                          for sel in ("input[name=code]","input[type=tel]","input[aria-label*=code i]"):
                              if await pg.query_selector(sel):
                                  await pg.fill(sel,code); print("  code_filled",sel,flush=True); break
                          await next_btn(pg,"code"); await pg.wait_for_timeout(15000)
                  print("FINAL_URL=",pg.url[:250],flush=True)
                  print("FINAL_BODY=",json.dumps(await body(pg,1200),ensure_ascii=False),flush=True)
                  print("CREDS=",json.dumps({"email":email,"pwd":PWD,"jwt":jwt[:20]+"..."}),flush=True)
                  await b.close()
          asyncio.run(main())
          PY
